<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111814" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme and language before the application module loads.
      (() => {
        let saved = null;
        let savedLocale = null;
        try {
          saved = localStorage.getItem("webmux.theme");
          savedLocale = localStorage.getItem("webmux.locale");
        } catch {
          // Storage can be unavailable in private browsing; system defaults remain usable.
        }
        const dark =
          saved === "dark" ||
          (saved !== "light" &&
            !matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.classList.toggle("dark", dark);
        let lang = "zh-CN";
        if (savedLocale === "zh-CN" || savedLocale === "en") {
          lang = savedLocale;
        } else {
          const list = navigator.languages?.length
            ? navigator.languages
            : navigator.language
              ? [navigator.language]
              : [];
          let resolved = null;
          let seen = false;
          for (const item of list) {
            const tag = String(item).trim().toLowerCase();
            if (!tag) continue;
            seen = true;
            if (
              tag === "zh" ||
              tag.startsWith("zh-") ||
              tag.startsWith("zh_")
            ) {
              resolved = "zh-CN";
              break;
            }
            if (
              tag === "en" ||
              tag.startsWith("en-") ||
              tag.startsWith("en_")
            ) {
              resolved = "en";
              break;
            }
          }
          lang = resolved ?? (seen ? "en" : "zh-CN");
        }
        document.documentElement.lang = lang;
      })();
    </script>
    <!-- font-preload:start -->
    <link
      rel="preload"
      href="/fonts/inter-latin-3100e775.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/maple-400-latin-0909c56b.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/maple-700-latin-9c0a39e5.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <!-- font-preload:end -->
    <title>WebMux</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
