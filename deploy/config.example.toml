# Default listens on loopback only; use "0.0.0.0:7681" to listen on all interfaces.
# Restrict access with a firewall/VPN when listening on non-loopback addresses.
listen = "127.0.0.1:7681"
# First start or `webmux config init` fills a random token here; if left empty,
# non-loopback or tunnel listeners generate a temporary token on each start.
token = ""
scrollback_bytes = 2097152
# Persist normalized ACP conversation bodies and handoff drafts in state_dir.
# false disables capture/history/handoff, retaining old data and pending guards.
history_capture = true
# Conservative historical context budget; allowed range: 1024-64000.
handoff_token_cap = 16000
default_cwd = "~"
# State includes settings, hybrid recovery metadata and normalized conversations.
# PTYs and terminal byte buffers are not saved.
# Default: $XDG_STATE_HOME/webmux, or ~/.local/state/webmux.
# Use a separate state_dir for each server instance. Git is optional.
# state_dir = "~/.local/state/webmux"
idle_after_seconds = 30
prompt_patterns = ['[$#%>❯›?:]\s*$', '(?i)\(y/n\)|\[y/n\]|yes.*no|press enter']
# Exact browser origins, lowercase, no path or trailing slash,
# e.g. ["http://127.0.0.1:5173"] for the Vite dev server.
allowed_origins = []
# Advertise WARP_CLI_AGENT_PROTOCOL_VERSION=1 so agents such as omp report
# questions, approvals and completion as structured terminal events.
agent_protocol = true
# Treat a terminal bell (not within 1 s of your own input) as needing attention.
bell_attention = true
# Answer the OSC 7501 program status query and read the status agents such as
# Claude Code, Codex, OpenCode and omp report with it.
program_status = true

# Optional Streamable HTTP MCP at /mcp on the existing listener.
# Requires a configured nonempty root token, even on loopback. This is the
# instance owner credential: it also authorizes REST and arbitrary command
# execution, not a scoped MCP account. Use trusted VPN/TLS for remote access.
# Disabled by default. Set the root token above before enabling; an empty
# token fails startup before any automatic token generation, even on loopback.
# To opt in, uncomment the table and set enabled = true, then restart.
# URL: https://YOUR_TRUSTED_HOST/mcp; Authorization: Bearer <root token>.
# Preserve Host/Origin at proxies; no OAuth, Unix/P2P endpoint or SSE.
# Roll back with enabled = false and restart (ordinary PTYs do not survive).
# Guide: docs/usage/mcp.md
#[mcp]
#enabled = false

# Cloudflare Tunnel: `webmux --tunnel` or enabled = true. Without a token a
# random 256-bit one is generated per start; tunnel mode prints it in links.
# A configured webmux token must be at least 43 characters in tunnel mode.
# The root `token` above is the WebMux login token; `[tunnel].token` below is
# the Cloudflare tunnel credential from the dashboard. They are different.
# Web Settings -> Public access persists enabled/mode/credential/hostname in
# <state_dir>/tunnel.json and overrides these defaults after the first save.
# cloudflared/download_mirrors remain TOML-only. --tunnel overrides this run only.
# [tunnel]
# enabled = false
# Empty = Quick Tunnel (random *.trycloudflare.com); set for a Named Tunnel.
# Named Tunnel also requires a hostname (the public hostname in Cloudflare).
# token = ""
# hostname = ""        # Named public hostname; bare ASCII/punycode, no wildcard
# cloudflared = ""     # explicit binary; default PATH, then a verified download
# Mirror prefixes tried after GitHub; [] = GitHub only.
# download_mirrors = ["https://ghfast.top", "https://gh-proxy.com"]
# Guide: docs/cloudflare-tunnel.md

# Tailscale Serve/Funnel: WebMux can create one exact HTTPS entry via the
# installed Tailscale CLI. Serve is tailnet-only; Funnel is public HTTPS and
# must be chosen explicitly. WebMux never runs `serve reset`, `funnel reset`,
# `sudo`, or changes .wslconfig/firewall/tailnet settings. The entry is owned
# by <state_dir>/tailscale.json and reconciled on the next start. Settings saved
# on the web page (Settings -> Tailscale) apply immediately, persist in
# <state_dir>/tailscale-settings.json and override mode/port/provider here.
# A configured root token must be at least 43 characters in either mode; an
# empty token is generated for this process and printed in the access link.
# [tailscale]
# mode = "off"          # off | serve | funnel
# port = 0              # 0 = auto (443, 8443, 10000); Funnel only 443/8443/10000
# provider = "auto"     # auto | linux | windows; windows requires WSL mirrored
# command = ""          # optional CLI path, e.g. /usr/bin/tailscale
# Guide: docs/tailscale.md

# Web Push attention alerts (question, approval, turn done, error, notify).
# Phones subscribe from an authorized HTTPS origin: the Named Tunnel
# https://<tunnel.hostname>, Tailscale Serve/Funnel, or an allowed_origins
# HTTPS proxy (a Quick Tunnel address changes every start); loopback works
# on desktops.
# Keys and subscriptions live in <state_dir>/push.json.
# [push]
# enabled = true
# subject = "https://github.com/mzdluo123/webmux"  # https:// URL or mailto:
# ttl_seconds = 86400                                 # 0..2419200
# kinds = ["question", "permission", "error", "done", "notify"]  # also "bell"
# include_title = true                                # false: title "WebMux"

# External speech recognition (ASR) driven over STDIN/STDOUT:
# WebMux sends 16kHz 16-bit signed little-endian mono PCM to STDIN, closes
# STDIN on stop, and reads NDJSON events (or plain text) from STDOUT.
# [voice]
# cmd = ["node", "/path/to/voice-provider.js"]
# env = ["DASHSCOPE_API_KEY=your-key"]

# Opportunistic P2P direct upgrade over WebRTC DataChannels (enabled by default).
# Loopback, private LAN, Tailscale and <15 ms baseline paths skip upgrade
# automatically; TURN/relay candidates are rejected so P2P stays zero-cost.
# Web Settings -> Network persists enabled/port_mapping/stun_servers in
# <state_dir>/p2p-settings.json and overrides these fields immediately.
# [p2p]
# enabled = true
# port_mapping = true  # UPnP IGD / NAT-PMP / PCP external UDP mapping
# stun_servers = [
#   "stun:stun.miwifi.com:3478",
#   "stun:stun.chat.bilibili.com:3478",
#   "stun:stun.cloudflare.com:3478",
#   "stun:stun.l.google.com:19302",
# ]

# Save custom launch configurations in Settings → 启动配置.
# Their complete argv and optional environment are stored separately in
# <state_dir>/launch-configs.json. When the launch plugin is enabled, its first
# start seeds the editable presets described in docs/cli-agents.md.
# Commands run directly, without an implicit shell. To load ~/.bashrc for
# Open Code, save argv ["bash", "-ic", "exec opencode \"$@\"", "opencode"].

# 主题、字号、阅读偏好、快捷指令与主页工作树由 settings.json 管理并跨设备同步。
# TOML 保留启动、安全、进程策略与专用公网访问服务的默认值。

# New installations start with the terminal core only. Changes require restart.
# Omit this table only to retain the legacy full feature set on an existing
# installation. Explicit [] means no plugins; missing dependencies are errors.
# Available IDs: launch, workspace, code, files, chat, notifications,
# quick-commands, voice, forward, cloudflare, tailscale, p2p, mcp, immersive.
# chat requires launch and files. Plugins do not enable their network services:
# the existing [tunnel], [tailscale], [mcp], [p2p], etc. switches still apply.
[plugins]
enabled = []
# Example: enabled = ["launch", "files", "chat", "workspace", "code"]
