# nfpm configuration for the WebMux deb and rpm packages; `make
# linux-packages` runs it once per format and architecture with VERSION,
# ARCH (amd64 | arm64) and SERVER (that architecture's Linux binary) set.
# Paths are relative to the repository root.
name: webmux
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: net
priority: optional
maintainer: WebMux contributors
description: |
  Persistent web terminal for shells and CLI agents.
  Sessions survive browser disconnects; the binary embeds the web app.
  Enable the bundled user service with: systemctl --user enable --now webmux
  Signed releases install automatically through webmux-update.timer;
  turn that off with: systemctl disable --now webmux-update.timer
vendor: WebMux
homepage: https://github.com/mzdluo123/webmux
license: MIT
contents:
  - src: ${SERVER}
    dst: /usr/bin/webmux
    expand: true
    file_info:
      mode: 0755
  - src: deploy/linux/webmux.service
    dst: /usr/lib/systemd/user/webmux.service
    file_info:
      mode: 0644
  - src: deploy/linux/webmux-update.service
    dst: /usr/lib/systemd/system/webmux-update.service
    file_info:
      mode: 0644
  - src: deploy/linux/webmux-update.timer
    dst: /usr/lib/systemd/system/webmux-update.timer
    file_info:
      mode: 0644
# The timer is enabled on first install only and disabled on removal; the
# user unit webmux.service is never enabled, started or restarted.
scripts:
  postinstall: deploy/linux/postinstall.sh
  preremove: deploy/linux/preremove.sh
  postremove: deploy/linux/postremove.sh
