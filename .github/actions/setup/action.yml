name: Set up WebMux toolchain
description: >
  Restores dependency caches read-only and installs the requested toolchains.
  Caches are saved only from main, so pull requests never add per-ref copies
  to the repository's cache quota. Go modules and Go build/test results use
  separate keys: module downloads follow go.mod/go.sum, while the build cache
  rolls over weekly (plus on module changes) so main refreshes it without
  saving one full copy per Go commit; Go's content-addressed entries still
  reuse unchanged compilation units from an older cache.

inputs:
  frontend:
    description: Install pnpm and locked frontend dependencies.
    default: "true"
  node:
    description: Install the pinned Node runtime.
    default: "true"
  go:
    description: Install Go from go.mod and restore its module/build cache.
    default: "false"

outputs:
  pnpm-store:
    description: pnpm content-addressable store path.
    value: ${{ steps.pnpm-store.outputs.path }}
  pnpm-key:
    description: Exact pnpm cache key for this lockfile.
    value: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  pnpm-hit:
    description: Whether the exact pnpm cache key was restored.
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}
  go-mod-path:
    description: Go module cache path.
    value: ${{ steps.go-paths.outputs.mod }}
  go-mod-key:
    description: Exact Go module cache key for this go.mod/go.sum.
    value: ${{ steps.go-mod-cache.outputs.cache-primary-key }}
  go-mod-hit:
    description: Whether the exact Go module cache key was restored.
    value: ${{ steps.go-mod-cache.outputs.cache-hit }}
  go-build-path:
    description: Go build and test cache path.
    value: ${{ steps.go-paths.outputs.build }}
  go-build-key:
    description: Rolling Go build cache key for this week and module set.
    value: ${{ steps.go-build-cache.outputs.cache-primary-key }}
  go-build-hit:
    description: Whether the exact Go build cache key was restored.
    value: ${{ steps.go-build-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - if: inputs.frontend == 'true'
      uses: pnpm/action-setup@v6
      with:
        version: 12.11.2
    - if: inputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - if: inputs.frontend == 'true'
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - if: inputs.frontend == 'true'
      id: pnpm-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.frontend == 'true'
      shell: bash
      run: pnpm --dir web install --frozen-lockfile

    - if: inputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: false
    - if: inputs.go == 'true'
      id: go-paths
      shell: bash
      run: |
        {
          echo "mod<<EOF"
          go env GOMODCACHE
          echo "EOF"
          echo "build<<EOF"
          go env GOCACHE
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    # Modules only change with the module files, so this cache stays small and
    # stable. The build cache rolls over weekly instead of following every Go
    # source change: main saves at most one full copy per week per platform,
    # which keeps it from evicting the module and pnpm caches under the 10 GB
    # quota. Go's content-addressed entries still reuse unchanged packages from
    # the restored older cache, and a module change starts a fresh entry.
    - if: inputs.go == 'true'
      id: go-build-week
      shell: bash
      run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
    - if: inputs.go == 'true'
      id: go-mod-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-paths.outputs.mod }}
        key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: go-mod-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.go == 'true'
      id: go-build-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-paths.outputs.build }}
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-build-week.outputs.value }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: go-build-${{ runner.os }}-${{ runner.arch }}-
