name: Test

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs the complete suite before publishing.
  workflow_call:
    inputs:
      full:
        description: Skip change detection and run every job
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same pull request supersedes its running checks; main
# runs always finish so every merged commit keeps a complete result.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Platform-independent suites run on Ubuntu. macOS re-runs only what the OS
# can change: Go race for packages with process, PTY, filesystem or path
# behaviour, and the desktop E2E project against the native backend. Mobile
# emulation, static guards and the Windows tray/WSL clients behave the same
# on both hosts, so they run once on Ubuntu.
jobs:
  # Conservative change detection lives in a job rather than on.pull_request
  # paths: the workflow must always start so the required `Test result` check
  # reports. Unrecognised paths and tooling or dependency changes force a full
  # run, so a missing rule can only make CI slower, never skip coverage.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      web: ${{ steps.classify.outputs.web }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL: ${{ inputs.full }}
        run: |
          base="${BASE_SHA:-}"
          head="${HEAD_SHA:-${GITHUB_SHA:-HEAD}}"
          full_run() {
            {
              echo "go=true"
              echo "web=true"
              echo "docs_only=false"
              echo "full=true"
            } >> "$GITHUB_OUTPUT"
            echo "classify: full run ($1)"
            exit 0
          }
          if [ "${FORCE_FULL:-}" = true ]; then
            full_run "forced by caller"
          fi
          # The rules that decide which tests to skip must not come from the
          # pull request under test. Validate the base here, force a full run
          # for any tooling change independently of the classifier, then run
          # the base revision's copy of the script (falling back to the
          # workspace copy only when the base does not have one yet).
          if [[ -z "$base" || "$base" =~ ^0+$ ]] ||
            ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            full_run "missing base"
          fi
          if git diff --no-renames --name-only "$base...$head" | grep '^\.github/' > /dev/null; then
            full_run "tooling changed"
          fi
          script="$RUNNER_TEMP/classify-changes.sh"
          if git show "${base}:.github/scripts/classify-changes.sh" > "$script" 2>/dev/null; then
            bash "$script"
          else
            bash .github/scripts/classify-changes.sh
          fi

  lint:
    name: Format, check and build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Check formatting
        run: make format-check
      - name: Check documentation governance
        run: make docs-check
      - name: Check persistence inventory
        run: make persistence-check
      # These guards cover AGENTS.md/docs pages and web/src, so they must run
      # even when the Go race job is pruned for docs- or web-only changes.
      - name: Check agent and web static guards
        run: go test -count=1 ./internal/archtest -run '^(TestAgents|TestGenericCodeNamesNoAgent)'
      - name: Check the install script
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
        run: make test-install
      - name: Lint frontend
        if: needs.changes.outputs.web == 'true'
        run: pnpm --dir web lint
      - name: Check frontend test types
        if: needs.changes.outputs.web == 'true'
        run: pnpm --dir web check:test
      - name: Check frontend architecture
        if: needs.changes.outputs.web == 'true'
        run: pnpm --dir web check:arch
      - name: Check and build frontend
        if: needs.changes.outputs.web == 'true'
        run: pnpm --dir web build
      # Go-only runs skip the frontend checks above, but golangci-lint still
      # needs the embedded archive to typecheck packages that import web.
      - name: Build embedded frontend for Go lint
        if: needs.changes.outputs.go == 'true' && needs.changes.outputs.web != 'true'
        run: pnpm --dir web exec vite build
      - name: Lint Go
        if: needs.changes.outputs.go == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m
          only-new-issues: false
      - name: Save pnpm cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.pnpm-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup.outputs.pnpm-store }}
          key: ${{ steps.setup.outputs.pnpm-key }}

  # Builds the frontend and both native E2E executables once. Splitting this
  # from the Go race job lets web-only changes publish the runtime without
  # paying for the full Go suite.
  runtime:
    name: E2E runtime
    needs: changes
    if: needs.changes.result == 'success' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Build embedded frontend
        run: pnpm --dir web exec vite build
      - name: Build shared E2E runtime
        run: |
          node .github/scripts/package-e2e-runtime.mjs "$RUNNER_TEMP/webmux-e2e"
          tar -czf "$RUNNER_TEMP/webmux-e2e.tar.gz" -C "$RUNNER_TEMP/webmux-e2e" web .ci-runtime
      - name: Share E2E runtime
        uses: actions/upload-artifact@v6
        with:
          name: e2e-runtime
          path: ${{ runner.temp }}/webmux-e2e.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  go:
    name: Go race (Ubuntu)
    needs: [changes, runtime]
    if: needs.changes.result == 'success' && needs.runtime.result == 'success' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./.github/actions/setup
        with:
          frontend: "false"
          node: "false"
          go: "true"
      - name: Download shared E2E runtime
        uses: actions/download-artifact@v7
        with:
          name: e2e-runtime
          path: ${{ runner.temp }}
      - name: Extract embedded frontend
        run: tar -xzf "$RUNNER_TEMP/webmux-e2e.tar.gz" -C "$GITHUB_WORKSPACE" web/dist
      - name: Vet Go
        run: go vet -printf.funcs=problemf,invalidf,usagef,checkf ./...
      # macOS runs only the race tests; vet its build tags here so the
      # *_darwin.go files are checked without another macOS runner.
      - name: Vet the macOS build
        run: GOOS=darwin go vet -printf.funcs=problemf,invalidf,usagef,checkf ./...
      - name: Run Go race tests
        run: go test -race -parallel=4 ./...
      # No Windows runner: hosted runners lack a usable WSL 2, so the Windows
      # clients are cross-compiled and vetted here and verified by hand in WSL.
      - name: Cross-compile the Windows tray and console client
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -o /dev/null ./cmd/webmux-tray
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -o /dev/null ./cmd/webmux-windows
          done
      - name: Vet the Windows clients
        run: GOOS=windows go vet -printf.funcs=problemf,invalidf,usagef,checkf ./cmd/webmux-tray ./cmd/webmux-windows ./internal/tray/... ./internal/wslclient/... ./internal/attach/... ./internal/sessioncmd/...
      - name: Warm the E2E backend build cache
        run: go build -o /dev/null ./cmd/webmux
      - name: Save Go module cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-mod-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup.outputs.go-mod-path }}
          key: ${{ steps.setup.outputs.go-mod-key }}
      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-build-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup.outputs.go-build-path }}
          key: ${{ steps.setup.outputs.go-build-key }}

  vitest:
    name: Vitest unit and browser
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - name: Run Vitest unit suite
        run: pnpm --dir web test:unit
      - name: Run Vitest browser suite
        run: pnpm --dir web test:browser
      - name: Preserve Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vitest-results
          path: web/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 14

  storybook:
    name: Storybook
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - name: Build and test Storybook
        run: pnpm --dir web test:storybook
      - name: Preserve Storybook diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: storybook-results
          path: |
            web/playwright-report/storybook/
            web/test-results/storybook/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (Ubuntu ${{ matrix.shard }}/4)
    needs: [changes, runtime]
    if: needs.changes.result == 'success' && needs.runtime.result == 'success' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          frontend: "false"
      - name: Download shared E2E runtime
        uses: actions/download-artifact@v7
        with:
          name: e2e-runtime
          path: ${{ runner.temp }}
      - name: Extract shared E2E runtime
        run: tar -xzf "$RUNNER_TEMP/webmux-e2e.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Install test browser
        uses: ./.github/actions/playwright
      - name: Run Playwright E2E shard
        env:
          WEBMUX_E2E_BINARY: ${{ github.workspace }}/.ci-runtime/linux/webmux
        working-directory: web
        run: node node_modules/playwright/cli.js test --config playwright.config.ts --shard=${{ matrix.shard }}/4
      - name: Preserve E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-ubuntu-${{ matrix.shard }}
          path: |
            web/playwright-report/e2e/
            web/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14

  macos-go:
    name: Go race (macOS)
    needs: [changes, runtime]
    if: needs.changes.result == 'success' && needs.runtime.result == 'success' && needs.changes.outputs.go == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - id: setup
        uses: ./.github/actions/setup
        with:
          frontend: "false"
          node: "false"
          go: "true"
      - name: Download shared E2E runtime
        uses: actions/download-artifact@v7
        with:
          name: e2e-runtime
          path: ${{ runner.temp }}
      - name: Extract embedded frontend
        run: tar -xzf "$RUNNER_TEMP/webmux-e2e.tar.gz" -C "$GITHUB_WORKSPACE" web/dist
      # Excluded packages are static guards (archtest, docguard) and the
      # Windows tray/WSL clients; Ubuntu runs them, and new packages are
      # included here by default.
      - name: Run native Go race tests
        run: |
          packages=$(go list ./... | grep -Ev '/internal/(archtest|docguard|tray|wsl|wslclient)(/|$)')
          go test -race -parallel=4 $packages
      - name: Save Go module cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-mod-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup.outputs.go-mod-path }}
          key: ${{ steps.setup.outputs.go-mod-key }}
      - name: Save Go build cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-build-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup.outputs.go-build-path }}
          key: ${{ steps.setup.outputs.go-build-key }}

  macos-e2e:
    name: E2E (macOS ${{ matrix.shard }}/2)
    needs: [changes, runtime]
    if: needs.changes.result == 'success' && needs.runtime.result == 'success' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true')
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          frontend: "false"
      - name: Download shared E2E runtime
        uses: actions/download-artifact@v7
        with:
          name: e2e-runtime
          path: ${{ runner.temp }}
      - name: Extract shared runtime
        run: tar -xzf "$RUNNER_TEMP/webmux-e2e.tar.gz" -C "$GITHUB_WORKSPACE"
      - name: Install test browser
        uses: ./.github/actions/playwright
      - name: Run Playwright E2E shard
        env:
          WEBMUX_E2E_BINARY: ${{ github.workspace }}/.ci-runtime/darwin/webmux
        working-directory: web
        run: node node_modules/playwright/cli.js test --config playwright.config.ts --project=chromium-desktop --shard=${{ matrix.shard }}/2
      - name: Preserve E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-macos-${{ matrix.shard }}
          path: |
            web/playwright-report/e2e/
            web/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: CLS and 4x CPU (Ubuntu)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - uses: ./.github/actions/playwright
      - name: Verify production layout stability and throttled interactions
        run: pnpm --dir web test:performance
      - name: Preserve performance measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-results
          path: |
            web/playwright-report/performance/
            web/test-results/performance/
          if-no-files-found: ignore
          retention-days: 14

  # The installer, `webmux-tray quit` and uninstall on a real Windows user
  # session. The runner has no WSL, so the tray stays in its "no WSL" state
  # and a placeholder stands in for the pre-seeded Linux server.
  windows-installer:
    name: Windows installer smoke
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.go == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          frontend: "false"
          node: "false"
          go: "true"
      - name: Build installers
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $makensis = Get-Command "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -ErrorAction SilentlyContinue
          }
          if (-not $makensis) {
            choco install nsis --no-progress -y
            $makensis = Get-Command "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          $bin = Join-Path $env:GITHUB_WORKSPACE 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          foreach ($arch in 'amd64', 'arm64') {
            $env:CGO_ENABLED = '0'; $env:GOOS = 'windows'; $env:GOARCH = $arch
            go build -trimpath -ldflags "-s -w -X main.version=0.0.1 -H=windowsgui" -o "$bin\webmux-tray-windows-$arch.exe" ./cmd/webmux-tray
            if ($LASTEXITCODE) { exit 1 }
            Set-Content -Path "$bin\webmux-linux-$arch" -Value "placeholder server $arch" -NoNewline
            # Quote every -D: PowerShell splits a bare -DVERSION=0.0.1 at the dots.
            & $makensis.Source -V2 -INPUTCHARSET UTF8 "-DVERSION=0.0.1" "-DARCH=$arch" "-DTRAY=$bin\webmux-tray-windows-$arch.exe" "-DSERVER=$bin\webmux-linux-$arch" "-DICON=$env:GITHUB_WORKSPACE\internal\tray\winui\icons\running.ico" "-DOUTFILE=$bin\webmux-setup-windows-$arch.exe" deploy\windows\webmux.nsi
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: Install, quit, upgrade and uninstall
        shell: powershell
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE 'bin'
          $sha = (Get-FileHash "$bin\webmux-linux-amd64" -Algorithm SHA256).Hash
          & .github\scripts\windows-installer-smoke.ps1 -Setup "$bin\webmux-setup-windows-amd64.exe" -SetupOtherArch "$bin\webmux-setup-windows-arm64.exe" -ServerSha256 $sha -Version 0.0.1 -Arch amd64

  # The deb and rpm packages built from a stand-in server are installed,
  # checked and removed in clean Debian and Fedora containers.
  linux-packages:
    name: Linux packages
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          frontend: "false"
          node: "false"
          go: "true"
      - name: Build packages
        run: |
          mkdir -p bin
          for arch in amd64 arm64; do
            printf '#!/bin/sh\necho "webmux 0.0.1"\n' > "bin/webmux-linux-$arch"
            chmod 755 "bin/webmux-linux-$arch"
          done
          make linux-packages VERSION=0.0.1
      - name: Install, check and remove in Debian and Fedora
        run: sh .github/scripts/test-linux-packages.sh bin 0.0.1

  # Single stable check name for branch protection, independent of job layout.
  # A job skipped by change detection is fine; a failed or cancelled one is not.
  test-result:
    name: Test result
    if: always()
    needs:
      [
        changes,
        lint,
        runtime,
        go,
        vitest,
        storybook,
        e2e,
        macos-go,
        macos-e2e,
        performance,
        windows-installer,
        linux-packages,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The classifier and lint job are never optional: accepting `skipped`
      # below must not let a classification failure or a skipped guard pass.
      - name: Require the classifier and lint job to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "changes: $CHANGES, lint: $LINT"
          [ "$CHANGES" = success ] && [ "$LINT" = success ]
      - name: Require every job to pass or be intentionally skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
      # Accepting `skipped` is only safe when the classifier said the job was
      # needed. Cross-check the expected results so a broken `if` or a wrong
      # classification cannot silently skip coverage and still pass.
      - name: Require the jobs selected by the classifier to succeed
        env:
          GO: ${{ needs.changes.outputs.go }}
          WEB: ${{ needs.changes.outputs.web }}
          RUNTIME: ${{ needs.runtime.result }}
          UBUNTU_GO: ${{ needs.go.result }}
          MACOS_GO: ${{ needs.macos-go.result }}
          VITEST: ${{ needs.vitest.result }}
          STORYBOOK: ${{ needs.storybook.result }}
          E2E: ${{ needs.e2e.result }}
          MACOS_E2E: ${{ needs.macos-e2e.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          WINDOWS_INSTALLER: ${{ needs.windows-installer.result }}
          LINUX_PACKAGES: ${{ needs.linux-packages.result }}
        run: |
          failed=0
          require_success() {
            if [ "$2" != success ]; then
              echo "$1: expected success for this change set, got '$2'"
              failed=1
            fi
          }
          if [ "$GO" = "true" ]; then
            require_success "E2E runtime" "$RUNTIME"
            require_success "Go race (Ubuntu)" "$UBUNTU_GO"
            require_success "Go race (macOS)" "$MACOS_GO"
            require_success "Windows installer smoke" "$WINDOWS_INSTALLER"
            require_success "Linux packages" "$LINUX_PACKAGES"
          fi
          if [ "$WEB" = "true" ]; then
            require_success "Vitest unit and browser" "$VITEST"
            require_success "Storybook" "$STORYBOOK"
            require_success "CLS and 4x CPU (Ubuntu)" "$PERFORMANCE"
          fi
          if [ "$GO" = "true" ] || [ "$WEB" = "true" ]; then
            require_success "E2E (Ubuntu)" "$E2E"
            require_success "E2E (macOS)" "$MACOS_E2E"
          fi
          exit "$failed"
