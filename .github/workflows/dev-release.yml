name: Dev release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

permissions:
  contents: read

# Publishes every main commit that passed Test as X.Y.Z-dev.N to the single
# rolling prerelease `dev` (never latest). X.Y.Z is the patch after the last
# vX.Y.Z tag, N the number of commits since it. The build job runs the
# commit that passed, not main's tip, and a newer run cancels it; signing
# and publishing are never cancelled, so the manifest is never left half
# replaced. Isolation is as in release.yml: the signing key reaches only the
# sign job, which receives nothing but SHA256SUMS.
#
# Publishing follows openspec release-distribution: upload this build's
# versioned files, replace install.sh, SHA256SUMS and its signature, move the
# `dev` tag, then delete every file this manifest does not list, so the
# Release holds only the current build. A client that read the previous
# manifest just before the switch fails its download and retries next check.
jobs:
  plan:
    name: Plan the development version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      # Full history and tags: the version counts commits since the last
      # release tag, and the docs-only check diffs against the `dev` tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - id: plan
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          skip() {
            echo "::notice::No development build: $1"
            exit 0
          }
          # A run whose commit is no longer main's tip would only build
          # something publish skips, and its build would cancel the tip's.
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main" != "$HEAD_SHA" ]; then
            skip "$HEAD_SHA is no longer the tip of main ($main)"
          fi
          describe=$(git describe --tags --long --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$HEAD_SHA")
          number='(0|[1-9][0-9]*)'
          if ! [[ $describe =~ ^v$number\.$number\.$number-([0-9]+)-g[0-9a-f]+$ ]]; then
            echo "unexpected git describe output: $describe" >&2
            exit 1
          fi
          count=${BASH_REMATCH[4]}
          if [ "$count" = 0 ]; then
            skip "$HEAD_SHA is release ${describe%-0-g*}"
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-dev.$count"

          # Skip documentation-only changes since the published commit, by
          # that commit's rules (as test.yml does, the rules under test are
          # not trusted); fall back to this copy only when it has none.
          if dev=$(git rev-parse -q --verify 'refs/tags/dev^{commit}') &&
            git merge-base --is-ancestor "$dev" "$HEAD_SHA"; then
            script="$RUNNER_TEMP/classify-changes.sh"
            if ! git show "$dev:.github/scripts/classify-changes.sh" > "$script" 2>/dev/null; then
              cp .github/scripts/classify-changes.sh "$script"
            fi
            result=$(mktemp "$RUNNER_TEMP/classify.XXXXXX")
            BASE_SHA=$dev HEAD_SHA=$HEAD_SHA GITHUB_OUTPUT=$result bash "$script"
            if grep -qx 'docs_only=true' "$result"; then
              skip "only documentation changed since dev ($dev)"
            fi
          fi
          echo "Development version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and check
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: dev-release
      cancel-in-progress: true
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    # Test on a push only covers that push's own diff, so a docs-only commit's
    # green run says nothing about earlier code commits this build includes.
    # The suite runs again here, as in release.yml, before anything is built.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Install NSIS for the Windows installers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - name: Build embedded frontend
        run: pnpm --dir web build
      - name: Run Go tests
        run: go test -race -parallel=4 ./...
      - name: Build release artifacts
        run: make release-build VERSION="$VERSION"
      - name: Verify artifacts
        working-directory: bin
        run: |
          sha256sum -c SHA256SUMS
          [ "$("./webmux-$VERSION-linux-amd64" version)" = "webmux $VERSION" ]
          sh ../.github/scripts/test-linux-packages.sh . "$VERSION"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          if-no-files-found: error
          retention-days: 7
          path: |
            bin/webmux-${{ needs.plan.outputs.version }}-*
            bin/webmux_${{ needs.plan.outputs.version }}-1_*.deb
            bin/install.sh
            bin/SHA256SUMS
      - name: Upload the checksum list for signing
        uses: actions/upload-artifact@v7
        with:
          name: sha256sums
          if-no-files-found: error
          retention-days: 7
          path: bin/SHA256SUMS

  sign:
    name: Sign SHA256SUMS
    needs: [plan, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Not in the publish group: signing touches no Release, and a waiting job
    # in a shared group could be replaced by an older run's publish.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # No dependency or build cache: the signer uses only the standard
      # library and this repository's own packages.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: sha256sums
          path: bin
      - name: Sign and verify with the built-in development keys
        env:
          WEBMUX_DEV_SIGNING_KEY: ${{ secrets.WEBMUX_DEV_SIGNING_KEY }}
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
          VERSION: ${{ needs.plan.outputs.version }}
        run: make release-sign VERSION="$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: sha256sums-signature
          if-no-files-found: error
          retention-days: 7
          path: bin/SHA256SUMS.minisig

  publish:
    name: Publish to the dev Release
    needs: [plan, build, sign]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: dev-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: bin
      - uses: actions/download-artifact@v8
        with:
          name: sha256sums-signature
          path: bin
      - name: Verify the signed checksums
        working-directory: bin
        env:
          GOTOOLCHAIN: local
        run: |
          sha256sum -c SHA256SUMS
          if grep -q 'SHA256SUMS.minisig' SHA256SUMS; then echo 'SHA256SUMS must not list its signature' >&2; exit 1; fi
          (cd .. && go run ./cmd/internal/releasesign verify -version "$VERSION" bin/SHA256SUMS)
      # Test runs may finish out of push order: publish only main's tip, and
      # only above the version the dev Release serves now, so `dev` never
      # goes back.
      - name: Check that this build is the newest
        id: newest
        env:
          GOTOOLCHAIN: local
        run: |
          skip() {
            echo "::notice::Not publishing $VERSION: $1"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          main=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main" != "$HEAD_SHA" ]; then
            skip "$HEAD_SHA is no longer the tip of main ($main)"
          fi

          current="$RUNNER_TEMP/current"
          mkdir -p "$current"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev" --jq '.assets[].name' > "$current/assets" 2> "$current/error"; then
            if ! grep -q 'HTTP 404' "$current/error"; then
              cat "$current/error" >&2
              exit 1
            fi
            echo "The dev Release does not exist yet"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          for name in SHA256SUMS SHA256SUMS.minisig; do
            if grep -qxF "$name" "$current/assets"; then
              gh release download dev --pattern "$name" --dir "$current"
            fi
          done
          # Trust the served version only when the served pair verifies: an
          # interrupted --clobber upload can leave a new signature over an old
          # or missing list, and skipping on that would never repair it.
          if [ -f "$current/SHA256SUMS" ] && [ -f "$current/SHA256SUMS.minisig" ] &&
            verified=$(go run ./cmd/internal/releasesign verify "$current/SHA256SUMS"); then
            published=$(sed -n 's/.*signature OK (webmux \(.*\))$/\1/p' <<< "$verified")
            dev_version='^[0-9]+\.[0-9]+\.[0-9]+-dev\.[1-9][0-9]*$'
            if ! [[ $published =~ $dev_version ]]; then
              echo "the dev Release serves an unexpected version: '$published'" >&2
              exit 1
            fi
            if [ "$published" = "$VERSION" ] ||
              [ "$(printf '%s\n' "$published" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
              skip "the dev Release already serves $published"
            fi
            echo "The dev Release serves $published"
          else
            echo "::warning::The dev Release has no verifiable SHA256SUMS pair; publishing $VERSION over it"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.newest.outputs.publish == 'true'
        working-directory: bin
        env:
          EXISTS: ${{ steps.newest.outputs.exists }}
        run: |
          names() {
            awk '{ n = $2; sub(/^\*/, "", n); print n }' "$1"
          }
          if [ "$EXISTS" != true ]; then
            gh release create dev --prerelease --latest=false --target "$HEAD_SHA" \
              --title "WebMux 开发版" \
              --notes "main 上通过 CI 的最新开发版，版本见 SHA256SUMS.minisig 的可信注释。安装：curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/dev/install.sh | WEBMUX_CHANNEL=dev sh"
          fi

          # Versioned files first; --clobber only replaces leftovers of an
          # earlier failed attempt at this same version.
          mapfile -t assets < <(names SHA256SUMS | grep -vx install.sh)
          gh release upload dev --clobber "${assets[@]}"
          gh release upload dev --clobber install.sh SHA256SUMS SHA256SUMS.minisig
          git push --force origin "$HEAD_SHA:refs/tags/dev"

          keep=$({ names SHA256SUMS; printf '%s\n' install.sh SHA256SUMS SHA256SUMS.minisig; } | sort -u)
          mapfile -t present < <(gh release view dev --json assets --jq '.assets[].name')
          for name in "${present[@]}"; do
            if ! grep -qxF -- "$name" <<< "$keep"; then
              echo "Deleting $name"
              gh release delete-asset dev "$name" --yes
            fi
          done
