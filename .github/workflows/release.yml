name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The Release is created only after every build, check and the signature
# succeeded, so a failure never leaves a partial Release. The tray embeds the
# digests of the Linux servers built here (see the Makefile release-build
# target). The signing key reaches only the sign job, which runs on a fresh
# runner, receives nothing but SHA256SUMS and executes no third-party build
# code, so no build dependency can read the key.
jobs:
  # main pushes run the complete Test suite (every platform, E2E, Storybook,
  # performance) for each merged commit. When the tagged commit is on main and
  # that run passed in full, the release reuses it; otherwise `checks` runs
  # the suite again. Nothing is signed or published without one of the two.
  verify:
    name: Find the main Test run
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.main.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-main-test.sh "$GITHUB_SHA"

  checks:
    name: Checks
    needs: verify
    if: needs.verify.outputs.reuse != 'true'
    uses: ./.github/workflows/test.yml
    with:
      full: true

  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Check the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $GITHUB_REF_NAME is not v<MAJOR>.<MINOR>.<PATCH>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install NSIS for the Windows installers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - name: Build release artifacts
        run: make release-build VERSION=${{ steps.version.outputs.version }}
      - name: Verify artifacts
        working-directory: bin
        run: |
          sha256sum -c SHA256SUMS
          [ "$(./webmux-linux-amd64 version)" = "webmux ${{ steps.version.outputs.version }}" ]
          sh ../.github/scripts/test-linux-packages.sh . ${{ steps.version.outputs.version }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          if-no-files-found: error
          retention-days: 7
          path: |
            bin/webmux-linux-amd64
            bin/webmux-linux-arm64
            bin/webmux-darwin-amd64
            bin/webmux-darwin-arm64
            bin/webmux-windows-amd64.exe
            bin/webmux-windows-arm64.exe
            bin/webmux-tray-windows-amd64.exe
            bin/webmux-tray-windows-arm64.exe
            bin/webmux-setup-windows-amd64.exe
            bin/webmux-setup-windows-arm64.exe
            bin/webmux_*-1_*.deb
            bin/webmux-*-1.*.rpm
            bin/install.sh
            bin/SHA256SUMS
      - name: Upload the checksum list for signing
        uses: actions/upload-artifact@v7
        with:
          name: sha256sums
          if-no-files-found: error
          retention-days: 7
          path: bin/SHA256SUMS

  sign:
    name: Sign SHA256SUMS
    needs: [build, verify, checks]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.verify.result == 'success' && (needs.checks.result == 'success' || (needs.verify.outputs.reuse == 'true' && needs.checks.result == 'skipped')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No dependency or build cache: the signer uses only the standard
      # library and this repository's own packages.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: sha256sums
          path: bin
      - name: Sign and verify with the built-in public keys
        env:
          WEBMUX_RELEASE_SIGNING_KEY: ${{ secrets.WEBMUX_RELEASE_SIGNING_KEY }}
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: make release-sign VERSION=${{ needs.build.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: sha256sums-signature
          if-no-files-found: error
          retention-days: 7
          path: bin/SHA256SUMS.minisig

  publish:
    name: Publish the Release
    needs: [build, verify, checks, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sign.result == 'success' && needs.verify.result == 'success' && (needs.checks.result == 'success' || (needs.verify.outputs.reuse == 'true' && needs.checks.result == 'skipped')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history and tags, to find the previous release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: bin
      - uses: actions/download-artifact@v8
        with:
          name: sha256sums-signature
          path: bin
      - name: Verify the signed checksums
        working-directory: bin
        env:
          GOTOOLCHAIN: local
        run: |
          sha256sum -c SHA256SUMS
          if grep -q 'SHA256SUMS.minisig' SHA256SUMS; then echo 'SHA256SUMS must not list its signature' >&2; exit 1; fi
          (cd .. && go run ./cmd/internal/releasesign verify -version ${{ needs.build.outputs.version }} bin/SHA256SUMS)
      # The generated notes start at the previous v* release, not at the
      # rolling `dev` tag, which is usually the closest earlier tag.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: bin
        run: |
          notes=()
          if previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$GITHUB_SHA^" 2>/dev/null); then
            notes=(--notes-start-tag "$previous")
          fi
          gh release create "$GITHUB_REF_NAME" --title "WebMux $GITHUB_REF_NAME" --generate-notes "${notes[@]}" \
            webmux-linux-amd64 webmux-linux-arm64 webmux-darwin-amd64 webmux-darwin-arm64 \
            webmux-windows-amd64.exe webmux-windows-arm64.exe \
            webmux-tray-windows-amd64.exe webmux-tray-windows-arm64.exe \
            webmux-setup-windows-amd64.exe webmux-setup-windows-arm64.exe \
            webmux_*-1_*.deb webmux-*-1.*.rpm install.sh SHA256SUMS SHA256SUMS.minisig

  # Tell the docs site (mzdluo123/webmux-site) to re-sync and redeploy. Its Site
  # workflow listens for repository_dispatch type `webmux-release` and mirrors
  # the latest Release. GITHUB_TOKEN cannot dispatch to another repository, so
  # this needs SITE_DISPATCH_TOKEN: a fine-grained PAT scoped to webmux-site
  # with "Contents: Read and write". Without it the job only warns, and the
  # site's daily schedule picks the Release up within a day. A failure here
  # never affects the already published Release.
  notify-site:
    name: Trigger the site rebuild
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Dispatch webmux-release to webmux-site
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set; the site will pick up $GITHUB_REF_NAME at its next scheduled run."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mzdluo123/webmux-site/dispatches \
            -d "{\"event_type\":\"webmux-release\",\"client_payload\":{\"ref\":\"$GITHUB_REF_NAME\"}}"
          echo "Dispatched webmux-release ($GITHUB_REF_NAME) to mzdluo123/webmux-site."
